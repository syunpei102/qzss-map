<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>QZSS 稼働状況</title>
<link rel="stylesheet" href="./style.css">
<style>
  html, body {
    margin: 0; padding: 0;
    background-color: #14161a;
    color: azure;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #9aa0a6; font-size: 13px; margin: 0 0 20px; }

  .overall {
    display: flex; align-items: center; gap: 12px;
    background: #1e2126; border-radius: 10px; padding: 18px 20px;
    border: 1px solid rgba(255,255,255,0.06); margin-bottom: 20px;
  }
  .overall.is-ok { border-color: rgba(46, 204, 113, 0.45); }
  .overall.is-ng { border-color: rgba(231, 76, 60, 0.55); }
  .overall .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .overall.is-ok .dot { background: #2ecc71; box-shadow: 0 0 10px rgba(46,204,113,.7); }
  .overall.is-ng .dot { background: #e74c3c; box-shadow: 0 0 10px rgba(231,76,60,.7); }
  .overall .text { display: flex; flex-direction: column; gap: 2px; }
  .overall .title { font-size: 16px; font-weight: 700; }
  .overall .sub { font-size: 12px; color: #9aa0a6; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .stat-card {
    background: #1e2126; border-radius: 10px; padding: 16px 18px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column; gap: 6px;
  }
  .stat-card .label { color: #9aa0a6; font-size: 12px; font-weight: 500; letter-spacing: 0.01em; }
  .stat-card .value { font-size: 22px; font-weight: 600; line-height: 1.15; color: #f4f6f8; font-variant-numeric: tabular-nums; }
  .stat-card .value .unit { font-size: 13px; font-weight: 500; color: #9aa0a6; margin-left: 3px; }
  .stat-card .sub { color: #6b7178; font-size: 11.5px; }

  h2.section-title { font-size: 15px; margin: 32px 0 10px; }

  .checks { display: flex; flex-direction: column; gap: 8px; }
  .check-row {
    display: flex; align-items: center; gap: 10px;
    background: #1e2126; border-radius: 8px; padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .check-row .badge { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .check-row.is-ok .badge { background: #2ecc71; }
  .check-row.is-ng .badge { background: #e74c3c; }
  .check-row .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .check-row .name { font-size: 13.5px; font-weight: 600; }
  .check-row .detail { font-size: 12px; color: #9aa0a6; }

  canvas { width: 100%; background: #1e2126; border-radius: 8px; display: block; }
  .chart-caption { font-size: 11.5px; color: #6b7178; margin-top: 8px; }

  .empty { color: #9aa0a6; font-size: 13px; padding: 40px 0; text-align: center; }
  .footer-note { font-size: 11.5px; color: #6b7178; margin-top: 36px; line-height: 1.6; }
  a.back-link {
    display: inline-block; margin-top: 4px; color: #6fd1c4; font-size: 13px; text-decoration: none;
  }
  a.back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📡 稼働状況</h1>
  <p class="sub">5分おきに自動更新します。受信機からのデータ受信・拠点の接続状況をチェックしています。</p>

  <div class="overall" id="overall">
    <div class="dot"></div>
    <div class="text">
      <div class="title" id="overall_title">確認中…</div>
      <div class="sub" id="overall_sub"></div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <h2 class="section-title">チェック項目</h2>
  <div class="checks" id="checks"></div>

  <h2 class="section-title">受信件数の推移(5分おきに直近1分間をサンプリング)</h2>
  <canvas id="chart" height="160"></canvas>
  <div class="chart-caption" id="chart_caption"></div>
  <div class="empty" id="empty-msg" style="display:none">まだ記録がありません。サーバー起動から5分ほどお待ちください。</div>

  <div class="footer-note">
    最終更新: <span id="updated_at">-</span><br>
    <a class="back-link" href="./">← 地図に戻る</a>
     ・ <a class="back-link" href="./latency.html">レイテンシーダッシュボード →</a>
  </div>
</div>

<script>
const REFRESH_INTERVAL_MS = 5 * 60 * 1000;

function formatDuration(ms) {
  const totalMinutes = Math.floor(ms / 60000);
  const days = Math.floor(totalMinutes / (60 * 24));
  const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
  const minutes = totalMinutes % 60;
  const parts = [];
  if (days) parts.push(`${days}日`);
  if (days || hours) parts.push(`${hours}時間`);
  parts.push(`${minutes}分`);
  return parts.join(' ');
}

function formatClock(ms) {
  return new Date(ms).toLocaleString('ja-JP', { hour12: false });
}

async function fetchStatus() {
  try {
    const res = await fetch('./api/system-status');
    return await res.json();
  } catch (e) {
    return null;
  }
}

function renderOverall(data) {
  const el = document.getElementById('overall');
  const title = document.getElementById('overall_title');
  const sub = document.getElementById('overall_sub');
  if (!data) {
    el.className = 'overall is-ng';
    title.textContent = '状態を取得できませんでした';
    sub.textContent = 'サーバーに接続できていません';
    return;
  }
  el.className = 'overall ' + (data.healthy ? 'is-ok' : 'is-ng');
  title.textContent = data.healthy ? '正常に稼働しています' : '異常の可能性があります';
  sub.textContent = `稼働時間: ${formatDuration(data.uptimeMs)}`;
}

function renderStats(data) {
  const el = document.getElementById('stats');
  if (!data) { el.innerHTML = ''; return; }
  const cards = [
    { label: '稼働時間', value: formatDuration(data.uptimeMs), unit: '' },
    { label: '直近1分間の受信', value: `${data.lastMinuteReceiveCount}`, unit: '件' },
    { label: 'WebSocket接続中', value: `${data.websocketClients}`, unit: '件' },
  ];
  el.innerHTML = cards.map((c) => `
    <div class="stat-card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}<span class="unit">${c.unit}</span></div>
    </div>
  `).join('');
}

function renderChecks(data) {
  const el = document.getElementById('checks');
  if (!data || !data.checks) { el.innerHTML = ''; return; }
  el.innerHTML = data.checks.map((c) => `
    <div class="check-row ${c.ok ? 'is-ok' : 'is-ng'}">
      <div class="badge"></div>
      <div class="body">
        <div class="name">${c.ok ? '✅' : '⚠️'} ${escapeHtml(c.name)}</div>
        <div class="detail">${escapeHtml(c.detail || '')}</div>
      </div>
    </div>
  `).join('');
}

function renderChart(data) {
  const canvas = document.getElementById('chart');
  const emptyMsg = document.getElementById('empty-msg');
  const caption = document.getElementById('chart_caption');
  const history = (data && data.receiveCountHistory) || [];
  if (!history.length) {
    canvas.style.display = 'none';
    emptyMsg.style.display = 'block';
    caption.textContent = '';
    return;
  }
  canvas.style.display = 'block';
  emptyMsg.style.display = 'none';

  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || 700;
  const cssHeight = 160;
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const recent = history.slice(-96); // 直近8時間分(5分x96)
  const maxCount = Math.max(...recent.map((h) => h.count), 4);
  const barGap = 2;
  const barWidth = Math.max(1, (cssWidth - barGap * recent.length) / recent.length);
  const padBottom = 20;
  const scale = (cssHeight - padBottom) / maxCount;

  recent.forEach((h, i) => {
    const x = i * (barWidth + barGap);
    const barH = Math.max(1, h.count * scale);
    ctx.fillStyle = h.count > 0 ? '#4c8bf5' : 'rgba(231, 76, 60, 0.7)';
    ctx.fillRect(x, cssHeight - padBottom - barH, barWidth, barH);
  });

  ctx.strokeStyle = '#2a2e35';
  ctx.beginPath();
  ctx.moveTo(0, cssHeight - padBottom);
  ctx.lineTo(cssWidth, cssHeight - padBottom);
  ctx.stroke();

  const oldest = recent[0];
  const newest = recent[recent.length - 1];
  caption.textContent = `${formatClock(oldest.time)} 〜 ${formatClock(newest.time)}(棒が赤い=その1分間は受信が0件でした)`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function refresh() {
  const data = await fetchStatus();
  renderOverall(data);
  renderStats(data);
  renderChecks(data);
  renderChart(data);
  document.getElementById('updated_at').textContent = new Date().toLocaleString('ja-JP', { hour12: false });
}

refresh();
setInterval(refresh, REFRESH_INTERVAL_MS);
window.addEventListener('resize', () => fetchStatus().then(renderChart));
</script>
</body>
</html>
