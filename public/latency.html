<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>QZSS レイテンシダッシュボード</title>
<link rel="stylesheet" href="./style.css">
<style>
  html, body {
    margin: 0; padding: 0;
    background-color: #14161a;
    color: azure;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #9aa0a6; font-size: 13px; margin: 0 0 20px; }

  /* 統計タイル: 5枚とも同じ緑ボーダーで並んでいて意味の無い装飾になって
     いたのをやめ、ラベル/数値の階層をはっきりさせる。p95・最大だけは
     「注意が必要な値かどうか」という実際の意味を持たせて、閾値を超えた
     時だけステータスカラーで縁取る(常時色を付ける装飾ではない) */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .stat-card {
    background: #1e2126; border-radius: 10px; padding: 16px 18px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column; gap: 6px;
  }
  .stat-card.is-warning { border-color: rgba(231, 76, 60, 0.55); }
  .stat-card .label {
    color: #9aa0a6; font-size: 12px; font-weight: 500;
    letter-spacing: 0.01em;
  }
  .stat-card .value {
    font-size: 26px; font-weight: 600; line-height: 1.15;
    color: #f4f6f8; font-variant-numeric: normal;
  }
  .stat-card .value .unit { font-size: 15px; font-weight: 500; color: #9aa0a6; margin-left: 2px; }
  .stat-card .value.is-warning { color: #e74c3c; }
  .stat-card .sub { color: #6b7178; font-size: 11.5px; }
  canvas { width: 100%; background: #1e2126; border-radius: 8px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 28px; font-size: 12px; color: #9aa0a6; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .empty { color: #9aa0a6; font-size: 13px; padding: 40px 0; text-align: center; }
  .toggle-row {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9aa0a6;
    margin-bottom: 16px; cursor: pointer;
  }
  h2.section-title { font-size: 15px; margin: 32px 0 0; }

  /* パネル(main.jsのreport-card)と同じ見た目に揃えつつ、ダッシュボード
     専用の要素(計測バー・時刻)だけここで追加する */
  #history_container {
    background: #1e2126; border-radius: 8px; overflow: hidden; margin-top: 10px;
  }
  .report-card { position: relative; }
  .report-card.anomaly { background: rgba(231, 76, 60, 0.08); }
  .latency-bar-row {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    font-size: 11px; color: #9aa0a6;
  }
  .latency-bar {
    flex: 1; height: 6px; border-radius: 3px; overflow: hidden; display: flex;
    background: #0f1114;
  }
  .latency-bar span { display: block; height: 100%; }
  .latency-total { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .latency-total.anomaly { color: #e74c3c; font-weight: 600; }
  .recorded-time { font-size: 11px; color: #666; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⏱️ レイテンシダッシュボード</h1>
  <p class="sub">YouTube用クラウドコンピュータの配信ブラウザで計測します．緑色は受信から描画準備までの時間です．通信・画面の実点灯・YouTubeの配信遅延は含みません．5秒ごとに更新．</p>

  <div class="stats" id="stats"></div>

  <div class="legend">
    <span><i style="background:#4c8bf5"></i>受信機処理</span>
    <span><i style="background:#9c7fe0"></i>サーバー処理</span>
    <span><i style="background:#2ecc71"></i>配信画面の描画準備</span>
  </div>
  <canvas id="chart" height="200"></canvas>

  <h2 class="section-title">直近の計測(新しい順)</h2>
  <div id="history_container"></div>
  <div class="empty" id="empty-msg" style="display:none">配信ブラウザの計測はまだありません．次の通報から記録します．</div>
</div>

<script src="./training-report-filter.js"></script>
<script src="./latency-dedup.js"></script>
<script>
async function fetchHistory() {
  try {
    const res = await fetch('./api/youtube-latency-history',{cache:'no-store'});
    return await res.json();
  } catch (e) {
    return [];
  }
}

const { deduplicateLatencyHistory } = QzssLatencyDedup;

function percentile(sorted, p) {
  if (!sorted.length) return 0;
  const idx = Math.min(sorted.length - 1, Math.floor(p * sorted.length));
  return sorted[idx];
}

// 1秒未満のデコード処理(実測0.1ms未満のこともある)まで扱うため、
// 表記をsに統一しつつ小数点以下3桁(ミリ秒相当の精度)を保つ
const ANOMALY_THRESHOLD_MS = 1000;
function formatSeconds(ms) {
  return (ms / 1000).toFixed(3);
}

function renderStats(history) {
  const el = document.getElementById('stats');
  if (!history.length) { el.innerHTML = ''; return; }
  const totals = history.filter(h=>Number.isFinite(h.measuredMs)).map((h) => h.measuredMs).sort((a, b) => a - b);
  if (!totals.length) { el.textContent='描画時間は未計測です．'; return; }
  const avg = totals.reduce((a, b) => a + b, 0) / totals.length;
  const p50 = percentile(totals, 0.5);
  const p95 = percentile(totals, 0.95);
  const max = totals[totals.length - 1];
  const cards = [
    { label: '件数', value: `${history.length}`, unit: '件', sub: '本番データのみ' },
    { label: '平均', value: formatSeconds(avg), unit: 's' },
    { label: 'p50(中央値)', value: formatSeconds(p50), unit: 's' },
    { label: 'p95', value: formatSeconds(p95), unit: 's', warning: p95 > ANOMALY_THRESHOLD_MS },
    { label: '最大', value: formatSeconds(max), unit: 's', warning: max > ANOMALY_THRESHOLD_MS },
  ];
  el.innerHTML = cards.map((c) => `
    <div class="stat-card ${c.warning ? 'is-warning' : ''}">
      <div class="label">${c.label}</div>
      <div class="value ${c.warning ? 'is-warning' : ''}">${c.value}<span class="unit">${c.unit}</span></div>
      ${c.sub ? `<div class="sub">${c.sub}</div>` : ''}
    </div>
  `).join('');
}

function renderChart(history) {
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || 900;
  const cssHeight = 200;
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssWidth, cssHeight);
  if (!history.length) return;

  const recent = history.filter(h=>Number.isFinite(h.measuredMs)).slice(-60);
  if(!recent.length)return;
  // 通信エラー等でごく一部だけ極端に遅い値が混ざると、それに合わせて
  // 軸全体が縮小され正常系同士の比較ができなくなっていた。軸の上限は
  // 全体最大値ではなく、外れ値に引っ張られにくい四分位範囲(IQR)方式
  // (箱ひげ図の上限ヒンジ: Q3 + 1.5×IQR)で決め、それを超える棒は
  // 枠外へ切り詰めて上に▲マーク+実測値を表示する。p90など単純な
  // percentileだと、外れ値が2件以上混ざると外れ値自体がp90に入って
  // しまい軸が潰れたままになるケースがあったため採用している
  const sortedTotals = recent.map((h) => h.measuredMs).sort((a, b) => a - b);
  const trueMax = sortedTotals[sortedTotals.length - 1] || 0;
  let maxTotal;
  if (sortedTotals.length < 8) {
    // データ数が少ないと四分位が意味を持たないため、そのまま全体最大値を使う
    maxTotal = Math.max(trueMax, 100);
  } else {
    const q1 = percentile(sortedTotals, 0.25);
    const q3 = percentile(sortedTotals, 0.75);
    const iqr = q3 - q1;
    maxTotal = Math.max(q3 + iqr * 1.5, q3 * 1.1, 100);
  }
  const barGap = 3;
  const barWidth = Math.max(2, (cssWidth - barGap * recent.length) / recent.length);
  const padBottom = 20;
  const padTop = 16;
  const plotBottom = cssHeight - padBottom;
  const plotTop = padTop;
  const scale = (plotBottom - plotTop) / maxTotal;
  const colors = { receiverDecodeMs: '#4c8bf5', serverProcessingMs: '#9c7fe0', browserMs: '#2ecc71' };

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, plotTop, cssWidth, plotBottom - plotTop);
  ctx.clip();
  recent.forEach((h, i) => {
    let y = plotBottom;
    const x = i * (barWidth + barGap);
    for (const key of ['receiverDecodeMs', 'serverProcessingMs', 'browserMs']) {
      const segH = Math.max(0, key === 'browserMs' ? (h.clientVisualReadyMs ?? 0) : h[key]) * scale;
      ctx.fillStyle = colors[key];
      ctx.fillRect(x, y - segH, barWidth, segH);
      y -= segH;
    }
  });
  ctx.restore();

  ctx.fillStyle = '#e74c3c';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'center';
  recent.forEach((h, i) => {
    if (h.measuredMs <= maxTotal) return;
    const x = i * (barWidth + barGap) + barWidth / 2;
    ctx.beginPath();
    ctx.moveTo(x, plotTop - 6);
    ctx.lineTo(x - barWidth / 2, plotTop + 3);
    ctx.lineTo(x + barWidth / 2, plotTop + 3);
    ctx.closePath();
    ctx.fill();
    ctx.fillText(`${formatSeconds(h.measuredMs)}s`, x, plotTop - 8);
  });

  ctx.strokeStyle = '#2a2e35';
  ctx.beginPath();
  ctx.moveTo(0, plotBottom);
  ctx.lineTo(cssWidth, plotBottom);
  ctx.stroke();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ==================================================
// レポート内容の人間可読化。main.js の buildEventFromXxx 群と同じ
// 発想(種別ごとにタイトル・バッジ・詳細項目を組み立てる)を、地図の
// 描画には使わない読み取り専用の要約として簡易移植したもの。
// 翻訳テーブルもmain.jsの同名定数と揃えてある(表記がズレないように)
// ==================================================
const JALERT_HAZARD_JA = {
  'Missile attack': 'ミサイル発射', 'Air strike': '航空攻撃',
  'Guerrilla attack': 'ゲリラ・特殊部隊による攻撃', 'Special forces attack': 'ゲリラ・特殊部隊による攻撃',
  'Terrorism': 'テロ', 'Chemical attack': '化学攻撃', 'Attack with nuclear weapons': '核攻撃',
  'Earthquake': '地震', 'Tsunami': '津波', 'Volcano eruption': '火山噴火',
  'Safety warning': '安全に関する警告(訓練/試験を含む)',
};
const LALERT_HAZARD_JA = {
  'Earthquake': '地震', 'Tsunami': '津波', 'Tidal wave': '高波', 'Flood': '洪水',
  'Coastal flooding': '高潮', 'Rainfall': '大雨', 'Debris flow': '土石流', 'Landslide': '地すべり',
  'Crack in the ground / sinkhole': '地割れ・陥没', 'Avalanche risk': '雪崩', 'Snowdrifts': '吹きだまり',
  'Snow storm / blizzard': '暴風雪', 'Snowfall': '大雪', 'Volcano eruption': '火山噴火',
  'Ash fall': '降灰', 'Lava flow': '溶岩流', 'Pyroclastic flow': '火砕流',
  'Volcanic mud flow': '融雪型火山泥流', 'Tornado': '竜巻', 'Tropical cyclone (typhoon)': '台風',
  'Storm or thunderstorm': '暴風・雷', 'Wind / wave / storm surge': '強風・高波・高潮',
  'Lightning': '雷', 'Hail': 'ひょう', 'Structure fire / Industrial fire': '火災',
  'Forest fire': '林野火災', 'Building collapse': '建物倒壊',
  'Dam failure or bursting of a dam': 'ダム決壊', 'Dike failure or bursting of a dike': '堤防決壊',
  'Life Threatening situation': '生命に関わる状況', 'Safety warning': '安全に関する警告',
};
const HAZARD_DURATION_JA = {
  'Unknown': '不明', 'Duration < 6H': '6時間未満',
  '6H <= Duration < 12H': '6〜12時間', '12H <= Duration < 24H': '12〜24時間',
};
function hazardTypeJa(r) {
  const table = r.type === 'QzssDcxJAlert' ? JALERT_HAZARD_JA : LALERT_HAZARD_JA;
  return table[r.a4_hazard_type] || r.a4_hazard_type;
}
function hazardDurationJa(text) {
  return HAZARD_DURATION_JA[text] || text;
}
// report_timeが生のISO文字列(例: 2026-07-17T08:35:00)のまま表示されて
// いたのを、main.js側のformatDateTimeと同じ「M/D HH:MM」表記に揃える。
// main.js側と同じ理由でZ補完+Asia/Tokyo固定表示にしている(main.jsの
// formatDateTimeのコメント参照。ここで乖離させないよう修正時は両方直すこと)
function formatDateTime(iso) {
  if (!iso) return '';
  const withZ = /[zZ]|[+-]\d\d:\d\d$/.test(iso) ? iso : `${iso}Z`;
  const d = new Date(withZ);
  if (isNaN(d.getTime())) return iso;
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  });
  const p = Object.fromEntries(fmt.formatToParts(d).filter((x) => x.type !== 'literal').map((x) => [x.type, x.value]));
  return `${p.month}/${p.day} ${p.hour}:${p.minute}`;
}

// recordedAtは秒未満の差も比較したい計測値なので秒まで表示。以前は
// toLocaleTimeStringで時刻のみだったため日をまたぐと何日の記録か
// 分からなかった。formatDateTimeと同じくAsia/Tokyo固定+月/日表示にする
function formatRecordedAt(epochMs) {
  const d = new Date(epochMs);
  if (isNaN(d.getTime())) return '';
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
  });
  const p = Object.fromEntries(fmt.formatToParts(d).filter((x) => x.type !== 'literal').map((x) => [x.type, x.value]));
  return `${p.month}/${p.day} ${p.hour}:${p.minute}:${p.second}`;
}

function reportBadgeText(r) {
  if (!r) return '不明';
  if (r.type === 'QzssDcxLAlert') return 'Lアラート';
  if (r.type === 'QzssDcxMTInfo') return '自治体情報';
  if (r.type === 'QzssDcxJAlert') return 'Jアラート';
  if (r.disaster_category) return r.disaster_category;
  return r.type || '不明';
}

function reportSeverityClass(r) {
  if (!r) return 'sev-info';
  const isTraining = TrainingReportFilter.isOfficialTraining(r);
  if (isTraining) return 'sev-training';
  if (r.disaster_category_no === 1 || r.disaster_category_no === 5) return 'sev-emergency';
  if (r.disaster_category_no === 2 || r.disaster_category_no === 3) return 'sev-warning';
  if (r.disaster_category_no === 10) return 'sev-caution';
  if (r.type === 'QzssDcxLAlert' || r.type === 'QzssDcxJAlert' || r.type === 'QzssDcxMTInfo') return 'sev-info';
  return 'sev-info';
}

function reportTitle(r) {
  if (!r) return '(内容なし)';
  if (r.disaster_category) {
    return r.information_type && r.information_type !== '発表'
      ? `${r.disaster_category}(${r.information_type})`
      : r.disaster_category;
  }
  if (r.a4_hazard_type) return TrainingReportFilter.isOfficialTraining(r) ? `${hazardTypeJa(r)}(訓練)` : hazardTypeJa(r);
  return r.type || '(種別不明)';
}

function reportRows(r) {
  if (!r) return [];
  const rows = [];
  const push = (k, v) => { if (v !== undefined && v !== null && v !== '') rows.push([k, v]); };
  if (r.type === 'QzssDcxLAlert' || r.type === 'QzssDcxJAlert' || r.type === 'QzssDcxMTInfo') {
    const sev = (r.a5_severity || '').startsWith('Extreme') ? '最高度'
      : (r.a5_severity || '').startsWith('Severe') ? '警戒'
      : (r.a5_severity || '').startsWith('Moderate') ? '注意' : null;
    if (sev) push('深刻度', sev);
  }
  push('発表時刻', formatDateTime(r.report_time));
  push('震央', r.seismic_epicenter);
  push('マグニチュード', r.magnitude);
  push('震度', r.seismic_intensity_lower_limit);
  if (Array.isArray(r.eew_forecast_regions) && r.eew_forecast_regions.length) {
    push('対象地域', r.eew_forecast_regions.slice(0, 6).join('・') + (r.eew_forecast_regions.length > 6 ? ' 他' : ''));
  }
  push('対象地域', r.ex1_target_area_ja);
  if (Array.isArray(r.ex9_target_area_list_ja) && r.ex9_target_area_list_ja.length) {
    push('対象地域', r.ex9_target_area_list_ja.slice(0, 6).join('・') + (r.ex9_target_area_list_ja.length > 6 ? ' 他' : ''));
  }
  if (Array.isArray(r.weather_forecast_regions) && r.weather_forecast_regions.length) {
    push('対象地域', r.weather_forecast_regions.slice(0, 6).join('・') + (r.weather_forecast_regions.length > 6 ? ' 他' : ''));
  }
  if (r.a8_hazard_duration) push('継続時間', hazardDurationJa(r.a8_hazard_duration));
  return rows;
}

const LATENCY_SEGMENTS = [
  ['receiverDecodeMs', '#4c8bf5'],
  ['serverProcessingMs', '#9c7fe0'],
  ['browserMs', '#2ecc71'],
];

function displayResultText(entry) {
  const status = {applied: '表示データ反映', unchanged: '表示変更なし', skipped: '表示対象外', error: '表示処理失敗'};
  const reason = {'settings-unavailable': '設定取得失敗', 'training-off': '公式訓練OFF', 'category-off': '情報種別OFF', expired: '有効時間終了', filtered: '対象外の通報', 'render-failed': '処理エラー'};
  const result = entry.displayResult;
  const text = result ? (status[result.status] || '未確認') + (reason[result.reason] ? '（' + reason[result.reason] + '）' : '') : '表示結果未記録';
  const additional = (entry.displayObservations || []).map(value => displayResultText(value));
  return text + (entry.clientVersion ? '／画面 v' + entry.clientVersion : '／画面の版は未記録')
    + (additional.length ? '．追加確認：' + additional.join('；') : '');
}

function renderHistory(history) {
  const container = document.getElementById('history_container');
  const emptyMsg = document.getElementById('empty-msg');
  const recent = [...history].slice(-30).reverse();
  if (!recent.length) {
    container.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  container.innerHTML = recent.map((h) => {
    const r = h.reportSummary;
    const isAnomaly = h.measuredMs > ANOMALY_THRESHOLD_MS;
    const rowsHtml = reportRows(r).map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('');
    const maxSeg = Math.max(h.measuredMs, 1);
    const barHtml = LATENCY_SEGMENTS.map(([key, color]) =>
      `<span style="width:${Math.max(0, key === 'browserMs' ? (h.clientVisualReadyMs ?? 0) : h[key]) / maxSeg * 100}%; background:${color}"></span>`
    ).join('');
    return `
      <div class="report-card ${reportSeverityClass(r)} ${isAnomaly ? 'anomaly' : ''}">
        <div class="report-badge-row">
          <div class="badges-list"><div class="report-badge ${reportSeverityClass(r)}">${escapeHtml(reportBadgeText(r))}</div></div>
          <span class="satellite-tag">${latencySourceLabel(h)}</span>
        </div>
        <div class="report-title">${escapeHtml(reportTitle(r))}</div>
        <dl class="report-summary">${rowsHtml}</dl>
        <div class="recorded-time">${escapeHtml(displayResultText(h))}</div>
        <div class="latency-bar-row">
          <div class="latency-bar">${barHtml}</div>
          <span class="latency-total ${isAnomaly ? 'anomaly' : ''}">${h.measuredMs==null?'未計測':formatSeconds(h.measuredMs)+'s'}${isAnomaly ? ' ⚠️' : ''}</span>
        </div>
        <div class="recorded-time">記録 ${formatRecordedAt(h.recordedAt)}(受信機処理${formatSeconds(h.receiverDecodeMs)}s・サーバー処理${formatSeconds(h.serverProcessingMs)}s・ブラウザ処理${formatSeconds(h.clientProcessingMs)}s・表示準備${h.clientVisualReadyMs == null ? '未計測' : `${formatSeconds(h.clientVisualReadyMs)}s`})</div>
      </div>
    `;
  }).join('');
}

// 本番データのみを表示する．is_test_data(手動投入の検証データ)だけでなく，
// 衛星から実際に配信される公式の訓練/試験放送(report_classification_no
// ===7、またはLアラート/JアラートのDCXならa1_message_type==='Test')も
// 除外する。以前はis_test_dataしか見ておらず、ラベルは「本番信号のみ」を
// 謳いながら実際には訓練放送(例: 十津川村・境町のend-to-endテスト配信)
// が素通りしていた
// ローカルの確認URLでだけ，合成データも明示的に表示する．本番の既定表示は維持する．
const REPLAY_VIEW = ['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname)
  && new URLSearchParams(location.search).get('replay') === '1';
if (REPLAY_VIEW) {
  document.querySelector('h1').textContent += '（ローカル検証）';
}

function isProductionEntry(h) {
  if (h.isTestData) return false;
  const r = h.reportSummary;
  const isOfficialTrainingBroadcast = r && (r.is_test_data === true || TrainingReportFilter.isOfficialTraining(r));
  // 過去の手動テスト履歴にはisTestDataが保存されていないものがある．
  // 説明文・震央名が明示的なテスト表記の場合だけ補完する．
  const isLegacyTestData = r && (
    (typeof r.description === 'string' && /^test\d+$/i.test(r.description.trim())) ||
    (typeof r.seismic_epicenter === 'string' && /^テスト震央/.test(r.seismic_epicenter))
  );
  return !isOfficialTrainingBroadcast && !isLegacyTestData;
}

function latencySourceLabel(h) {
  return isProductionEntry(h) ? '📡 実データ' : '🧪 テストデータ';
}

async function refresh() {
  const all = await fetchHistory();
  const unique = deduplicateLatencyHistory(all);
  const history = unique.filter(h => h.schemaVersion === 2 && h.measurementSource === 'youtube-cloud' && (REPLAY_VIEW || isProductionEntry(h)));
  renderStats(history);
  renderChart(history);
  renderHistory(history);
}

refresh();
setInterval(refresh, 5000);
window.addEventListener('resize', refresh);
</script>
</body>
</html>
